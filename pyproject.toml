[project]
name = "kasoti"
version = "0.1.0"
description = "Prompt regression testing and guardrail harness for LLM classification tasks"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
kasoti = "kasoti.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kasoti"]

[tool.ruff]
# Generous line length: the ticket-template and prompt-yaml strings in datagen.py
# and prompts are natural-language content, not logic, and read worse hard-wrapped.
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's documented parameter-default pattern is `x: T = typer.Option(...)`.
"kasoti/cli.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
